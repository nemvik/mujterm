[build-system]
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[project]
name = "mujterm"
version = "0.1.0"
description = "A project-oriented Linux terminal with Codex and Claude status tracking"
requires-python = ">=3.10"

[project.scripts]
mujterm = "mujterm.__main__:main"
mujterm-agent-hook = "mujterm.agent_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
