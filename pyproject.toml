[build-system]
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[project]
name = "mujterm"
dynamic = ["version"]
description = "A project-oriented Linux terminal with Codex and Claude status tracking"
requires-python = ">=3.10"

[project.scripts]
mujterm = "mujterm.__main__:main"
mujterm-agent-hook = "mujterm.agent_bridge:main"
mujterm-shell = "mujterm.shell_bridge:launch_main"
mujterm-shell-hook = "mujterm.shell_bridge:hook_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "mujterm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
